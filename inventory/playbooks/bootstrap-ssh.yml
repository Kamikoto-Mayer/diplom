---
- name: Bootstrap SSH key on classroom hosts
  hosts: classroom
  gather_facts: false
  become: false

  tasks:
    - name: Add controller public key to admin account
      ansible.posix.authorized_key:
        user: admin
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/ansible_techschool_ed25519.pub') }}"